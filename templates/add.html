<!DOCTYPE html>
<html>
<head>
    <title>Add Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>

    <a href="/">Back to Applications</a>

    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}

   <form method="POST">
    <input type="text" name="company" value="{{ form_data.get('company', '') }}">
    <input type="text" name="position" value="{{ form_data.get('position', '') }}">
    <input type="date" name="application_date" value="{{ form_data.get('application_date', '') }}">
    <input type="date" name="deadline" value="{{ form_data.get('deadline', '') }}">
    <input type="url" name="job_url" value="{{ form_data.get('job_url', '') }}">
    <textarea name="notes">{{ form_data.get('notes', '') }}</textarea>

    <select name="status">
    <option value="Applied">Applied</option>
    <option value="Interview">Interview</option>
    <option value="Rejected">Rejected</option>
    <option value="Offer">Offer</option>
    </select>  

   
    <button type="submit">Add</button>
</form>
</body>
</html>
